name: Release
on:
  push:
    tags: ['v*']
  # A manual run builds and attests the package without publishing a release.
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
      - name: Validate version and release tag
        id: version
        shell: pwsh
        run: |
          [xml]$props = Get-Content Directory.Build.props -Raw
          $version = [string]$props.Project.PropertyGroup.Version
          if ($version -notmatch '^\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$') { throw 'Invalid version.' }
          if ($env:GITHUB_EVENT_NAME -eq 'push' -and $env:GITHUB_REF_NAME -cne "v$version") { throw 'Tag and Version do not match.' }
          "version=$version" >> $env:GITHUB_OUTPUT
          "asset=artifacts/Lutra-$version-win-x64.zip" >> $env:GITHUB_OUTPUT
      - name: Build, test and package
        shell: pwsh
        run: ./tools/Build.ps1 -Package
      - name: Attest the exact package
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.version.outputs.asset }}
      - name: Verify provenance
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ASSET: ${{ steps.version.outputs.asset }}
        run: |
          gh attestation verify $env:RELEASE_ASSET --repo $env:GITHUB_REPOSITORY --signer-workflow "$env:GITHUB_REPOSITORY/.github/workflows/release.yml"
          if ($LASTEXITCODE) { throw 'Provenance verification failed.' }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Lutra-release-candidate
          path: ${{ steps.version.outputs.asset }}
          if-no-files-found: error
      - name: Publish verified tag
        if: github.event_name == 'push'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          RELEASE_ASSET: ${{ steps.version.outputs.asset }}
        run: |
          $options = @('--verify-tag', '--generate-notes', '--draft', '--title', "Lutra $env:RELEASE_VERSION")
          if ($env:RELEASE_VERSION.Contains('-')) { $options += @('--prerelease', '--latest=false') }
          gh release create $env:GITHUB_REF_NAME $env:RELEASE_ASSET @options
          if ($LASTEXITCODE) { throw 'Release creation failed; existing assets will not be replaced.' }
          gh release edit $env:GITHUB_REF_NAME --draft=false
          if ($LASTEXITCODE) { throw 'Package uploaded to a draft; publication failed.' }
