name: CodeQL
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '26 6 * * 2'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  analyze:
    runs-on: windows-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
      - uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4
        with:
          languages: csharp
          build-mode: manual
      - name: Build for analysis
        shell: pwsh
        run: |
          dotnet restore Lutra.sln --locked-mode
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          dotnet build Lutra.sln -c Release --no-restore --no-incremental
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4
        with:
          category: /language:csharp
